name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest genlayer-test
          npm ci || npm install

      - name: Run ASCII check
        run: python scripts/scan_ascii.py

      - name: Run Banned Words check
        run: python scripts/scan_banned_words.py

      - name: Run Secret Scanner
        run: python scripts/scan_secrets.py

      - name: Run Unittest Layers (Layers 1-3 & Star Test)
        run: python -m unittest discover tests

      - name: Run Direct Mode Tests (Edge Cases)
        run: pytest tests/direct/test_direct_mode.py -v
